name: allervia-validation
services:
  certificates:
    build:
      context: .
      target: tools
    entrypoint: ["sh", "/create-certificates.sh"]
    volumes:
      - local-certificates:/certs
      - ./infra/local/create-certificates.sh:/create-certificates.sh:ro
    network_mode: none
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: allervia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local initialization first}
      POSTGRES_DB: allervia_demo
    volumes:
      - local-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allervia -d allervia_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://allervia:${POSTGRES_PASSWORD:?Required}@db:5432/allervia_demo
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
  mail-capture:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_SMTP_TLS_CERT: /certs/server.crt
      MP_SMTP_TLS_KEY: /certs/server.key
      MP_SMTP_REQUIRE_STARTTLS: 'true'
      MP_MAX_MESSAGES: 100
    ports: ["127.0.0.1:8025:8025"]
    volumes: ["local-certificates:/certs:ro"]
    depends_on:
      certificates:
        condition: service_completed_successfully
    networks: [private, local-access]
  backend:
    build:
      context: .
      target: runtime
    init: true
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      PORT: 3000
      HTTP_METRICS_LOG: 'true'
      DATABASE_URL: postgresql://allervia:${POSTGRES_PASSWORD:?Required}@db:5432/allervia_demo
      AUTH_ALLOWED_ORIGINS: https://localhost:8443
      AUTH_SESSION_CSRF_SECRET: ${AUTH_SESSION_CSRF_SECRET:?Required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Required}
      SUPER_ADMIN_REGISTRATION_KEY: ${SUPER_ADMIN_REGISTRATION_KEY:?Required}
      AUTH_MFA_ENFORCEMENT: optional
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mail-capture
      SMTP_PORT: 1025
      EMAIL_FROM: Allervia Local <no-reply@allervia.test>
      DEMO_REQUEST_EMAIL_TO: requests@allervia.test
      APP_BASE_URL: https://localhost:8443
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes: ["local-certificates:/certs:ro"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mail-capture:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]
  web:
    build:
      context: ${ALLERVIA_WEB_PATH:-../allervia-web}
    ports: ["127.0.0.1:8443:443"]
    volumes: ["local-certificates:/certs:ro"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [private, local-access]
  seed:
    profiles: [tools]
    build:
      context: .
      target: tools
    # Sharing db's network makes its localhost the guarded seed target.
    network_mode: service:db
    environment:
      DATABASE_URL: postgresql://allervia:${POSTGRES_PASSWORD:?Required}@localhost:5432/allervia_demo
      AUTH_SESSION_CSRF_SECRET: ${AUTH_SESSION_CSRF_SECRET:?Required}
      SUPER_ADMIN_REGISTRATION_KEY: ${SUPER_ADMIN_REGISTRATION_KEY:?Required}
    command: ["node", "scripts/operations/seed-local.cjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  local-database:
  local-certificates:
networks:
  private:
    internal: true
  # Docker Desktop needs a gateway network to publish loopback ports.
  # Only the proxy and the non-relaying SMTP capture join it.
  local-access:
