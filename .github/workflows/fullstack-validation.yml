name: Fullstack validation (no deployment)
on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Full backend commit SHA
        required: true
      frontend_sha:
        description: Full frontend commit SHA
        required: true
      contract_base_sha:
        description: Reviewed backend commit containing the previous OpenAPI contract
        required: true
permissions:
  contents: read
concurrency:
  group: fullstack-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: allervia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d allervia_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Validate immutable inputs
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
        run: |
          [[ "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.backend_sha }}
          path: allervia-backend
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: anaperinii/imunecare-web
          ref: ${{ inputs.frontend_sha }}
          path: allervia-web
          token: ${{ secrets.FULLSTACK_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: allervia-backend/.node-version
          cache: npm
          cache-dependency-path: |
            allervia-backend/package-lock.json
            allervia-web/package-lock.json
      - run: npm ci
        working-directory: allervia-backend
      - run: npm ci
        working-directory: allervia-web
      - run: node scripts/ci/write-test-environment.cjs
        working-directory: allervia-backend
        env:
          CI_DATABASE_PASSWORD: ephemeral-ci-only
      - run: npm run test:setup
        working-directory: allervia-backend
      - run: npm run contract:export
        working-directory: allervia-backend
      - run: git diff --exit-code -- docs/contracts/openapi.json
        working-directory: allervia-backend
      - run: node scripts/ci/check-contract-baseline.cjs
        working-directory: allervia-backend
        env:
          CONTRACT_BASE_SHA: ${{ inputs.contract_base_sha }}
      - run: npm run contract:check
        working-directory: allervia-web
      - run: npm run test:contract
        working-directory: allervia-backend
      - run: node scripts/ci/prepare-demo.cjs
        working-directory: allervia-backend
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        working-directory: allervia-web
      - run: node node_modules/@playwright/test/cli.js test --workers=1 --grep-invert "repro amplified"
        working-directory: allervia-web
      - name: Record validated pair
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
        run: |
          printf 'Backend: `%s`\n\nFrontend: `%s`\n' "$BACKEND_SHA" "$FRONTEND_SHA" >> "$GITHUB_STEP_SUMMARY"
